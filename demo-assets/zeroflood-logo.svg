<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f2b48" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#07111e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040810" stop-opacity="1"/>
    </radialGradient>

    <!-- Core Neon Cyan to Electric Blue Gradient -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#0051FF"/>
    </linearGradient>

    <!-- Wave Aqua Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0066FE"/>
    </linearGradient>

    <!-- Accent Amber/Gold for Warning/Depth Sensor -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38EF7D"/>
      <stop offset="100%" stop-color="#11998E"/>
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="800" rx="160" fill="#060b14"/>
  <circle cx="400" cy="400" r="380" fill="url(#bgGlow)"/>

  <!-- Radar / Vision Sensor HUD Rings -->
  <g opacity="0.4">
    <!-- Outer Orbit Ring -->
    <circle cx="400" cy="380" r="280" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.3"/>
    <!-- Sensor Depth Level Marks -->
    <circle cx="400" cy="380" r="240" fill="none" stroke="#4facfe" stroke-width="1" stroke-dasharray="16 12" opacity="0.4"/>
    <circle cx="400" cy="380" r="190" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Calibrated Depth Markers (VLRDR Depth Scale) -->
    <line x1="120" y1="380" x2="145" y2="380" stroke="#00F2FE" stroke-width="3" stroke-linecap="round"/>
    <line x1="655" y1="380" x2="680" y2="380" stroke="#00F2FE" stroke-width="3" stroke-linecap="round"/>
    <line x1="400" y1="100" x2="400" y2="125" stroke="#00F2FE" stroke-width="3" stroke-linecap="round"/>
    <line x1="400" y1="635" x2="400" y2="660" stroke="#00F2FE" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Central "ZERO" + "FLOOD SHIELD & WAVE" EMBLEM -->
  <g transform="translate(0, -20)">
    <!-- Ambient Shadow/Glow under emblem -->
    <ellipse cx="400" cy="400" rx="160" ry="200" fill="#00f2fe" opacity="0.12" filter="url(#intenseGlow)"/>

    <!-- Outer '0' Ring Shield Geometry -->
    <path d="M 400 150
             C 490 150 560 230 560 360
             C 560 480 490 570 400 570
             C 310 570 240 480 240 360
             C 240 230 310 150 400 150 Z"
          fill="none"
          stroke="url(#cyberCyan)"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#neonGlow)"/>

    <!-- Inner Protective Zero Core & Wave Dynamics -->
    <!-- Wave 1: Dynamic cresting water within Zero -->
    <path d="M 272 410
             C 310 440 350 450 395 420
             C 440 390 480 395 528 425
             C 542 405 548 383 548 360
             C 548 245 482 178 400 178
             C 318 178 252 245 252 360
             C 252 377 259 394 272 410 Z"
          fill="none"
          stroke="#00E5FF"
          stroke-width="10"
          stroke-linecap="round"
          opacity="0.8"/>

    <!-- High-Tech Flood Wave Layers at Base of '0' -->
    <path d="M 276 395
             Q 340 445 400 415
             T 524 410"
          fill="none"
          stroke="url(#cyberCyan)"
          stroke-width="18"
          stroke-linecap="round"/>

    <path d="M 300 455
             Q 355 490 400 470
             T 500 465"
          fill="none"
          stroke="#38EF7D"
          stroke-width="12"
          stroke-linecap="round"
          opacity="0.9"/>

    <!-- AI Vision Crosshair / Wheel Sensor Aperture at Center -->
    <circle cx="400" cy="310" r="32" fill="#07172b" stroke="#00f2fe" stroke-width="6"/>
    <circle cx="400" cy="310" r="14" fill="#00f2fe" filter="url(#neonGlow)"/>
    <line x1="400" y1="262" x2="400" y2="282" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
    <line x1="400" y1="338" x2="400" y2="358" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
    <line x1="352" y1="310" x2="372" y2="310" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
    <line x1="428" y1="310" x2="448" y2="310" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>

    <!-- Digital Pulse Nodes -->
    <circle cx="240" cy="360" r="8" fill="#00F2FE" filter="url(#neonGlow)"/>
    <circle cx="560" cy="360" r="8" fill="#00F2FE" filter="url(#neonGlow)"/>
    <circle cx="400" cy="150" r="8" fill="#38EF7D" filter="url(#neonGlow)"/>
    <circle cx="400" cy="570" r="8" fill="#00F2FE" filter="url(#neonGlow)"/>
  </g>

  <!-- Typography: ZEROFLOOD -->
  <text x="400" y="665"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="64"
        font-weight="900"
        letter-spacing="14"
        fill="#FFFFFF">
    ZERO<tspan fill="#00F2FE">FLOOD</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="400" y="715"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="16"
        font-weight="700"
        letter-spacing="8"
        fill="#6EE7B7">
    INTELLIGENT URBAN FLOOD RESILIENCE
  </text>
</svg>
